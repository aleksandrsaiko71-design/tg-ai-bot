# Дублирующий «будильник» на случай задержек планировщика GitHub.
name: keepalive-2

on:
  schedule:
    - cron: "5,25,45 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          set -e
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 120 https://tg-ai-bot-8zt7.onrender.com/healthz || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "healthz did not return 200"
          exit 1
